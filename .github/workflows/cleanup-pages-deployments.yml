name: Clean Up Superseded Pages Deployments

on:
  deployment_status:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-deployment-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete superseded GitHub Pages deployments
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;

            if (
              context.eventName === "deployment_status" &&
              (
                context.payload.deployment.environment !== "github-pages" ||
                context.payload.deployment_status.state !== "success"
              )
            ) {
              core.info("Ignoring a deployment event that is not a successful GitHub Pages deployment.");
              return;
            }

            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              {
                owner,
                repo,
                environment: "github-pages",
                per_page: 100,
              },
            );

            deployments.sort(
              (first, second) => new Date(second.created_at) - new Date(first.created_at),
            );

            if (deployments.length < 2) {
              core.info("Only one GitHub Pages deployment exists; there is nothing to clean up.");
              return;
            }

            const newestDeployment = deployments[0];
            const newestStatuses = await github.paginate(
              github.rest.repos.listDeploymentStatuses,
              {
                owner,
                repo,
                deployment_id: newestDeployment.id,
                per_page: 100,
              },
            );
            const newestStatus = newestStatuses.sort(
              (first, second) => new Date(second.created_at) - new Date(first.created_at),
            )[0];

            if (newestStatus?.state !== "success") {
              core.info("The newest GitHub Pages deployment is not successful yet; cleanup will retry later.");
              return;
            }

            const oldDeployments = deployments.slice(1);

            let deleted = 0;
            for (const deployment of oldDeployments) {
              await github.rest.repos.createDeploymentStatus({
                owner,
                repo,
                deployment_id: deployment.id,
                state: "inactive",
                auto_inactive: false,
                description: "Superseded by a newer successful GitHub Pages deployment.",
              });

              await github.rest.repos.deleteDeployment({
                owner,
                repo,
                deployment_id: deployment.id,
              });
              deleted += 1;
              core.info(`Deleted superseded deployment ${deployment.id}.`);
            }

            core.info(`Deleted ${deleted} superseded Pages deployment(s).`);
